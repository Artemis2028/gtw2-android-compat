plugins { id 'com.android.application' }

android {
    namespace 'com.invertbit.games.gtw.android.port'
    compileSdk 36
    def stableKs = rootProject.file('../src/signing/debug.keystore')
    signingConfigs {
        debug {
            if (stableKs.exists()) {
                storeFile stableKs
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    defaultConfig {
        applicationId 'com.invertbit.games.gtw.android.port'
        minSdk 21
        targetSdk 35
        versionCode 6
        versionName '1.6-port-m6'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main {
            assets.srcDirs = ['../../src/android/src/main/assets']
            jniLibs.srcDirs = ["$buildDir/natives"]
        }
    }
    lint { abortOnError false; checkReleaseBuilds false }
    packaging { jniLibs { useLegacyPackaging false } }
}

configurations { natives }

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:${gdxVersion}"
    implementation "com.badlogicgames.gdx:gdx-freetype:${gdxVersion}"
    natives "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-x86_64"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:${gdxVersion}:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:${gdxVersion}:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:${gdxVersion}:natives-x86"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:${gdxVersion}:natives-x86_64"
}

tasks.register('copyNatives') {
    def out = file("$buildDir/natives")
    outputs.dir out
    doLast {
        configurations.natives.files.each { jar ->
            def abi = jar.name =~ /natives-([^.]+)\.jar$/
            if (abi) {
                copy { from(zipTree(jar)) { include '*.so' }; into "$out/${abi[0][1]}" }
            }
        }
    }
}
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('JniLibFolders') }.configureEach {
    dependsOn 'copyNatives'
}
