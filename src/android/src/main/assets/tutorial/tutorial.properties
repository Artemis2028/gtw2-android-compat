TUTORIAL1.title=Silos and cities 1
TUTORIAL1.description1=1) To win defcon you have to destory all enemy cities.\n2) City is presented as a triangle on a map.\n3) City can be destroyed by intercontinental ballisctic missles.\n4) Missiles can be fired by silos, submarines or strategic bombers.
TUTORIAL1.description2=Lanuch balistic missile clicking on the blue silo \nand next choose a target city (or enemy silo).

TUTORIAL2.title=Silos and cities 2
TUTORIAL2.description1=1) Silos can contain 5MT, 10MT or 15MT missiles.\n2) 5MT (megatons) missiles have low energy but are very fast.\n3) 15MT rockets are slow but cause more damages.\n4) Cities can have 5 mln or more populatinos.\n5) Each 5MT anihilates 5mln population in city.
TUTORIAL2.description2=Lanuch balistic missile clicking on the blue silo and next choose a target city \nYou have to launch several missiles to destory 15mln cities.

TUTORIAL3.title=Submarines
TUTORIAL3.description1=1) When defcon starts all submarines are invisible for opponent.\n2) When submarine lanuches the first rocket it becomes visible.\n3) Only visible subs can be attacked.\n3) Submarines lanuch only 5MT missiles.
TUTORIAL3.description2=Lanuch balistic missile clicking on blue submarine and next choose a target city.

TUTORIAL4.title=Bombers
TUTORIAL4.description1=1) Bombers cannot be attacked by opponent.\n2) They fly slow and contain only 5MT bombs.
TUTORIAL4.description2=To bomb city click on blue bomber and then choose a target city.

TUTORIAL5.title=Alliances
TUTORIAL5.description1=1) After each defcon you can join a new alliance.\n2) Each alliance increase your nuclear power.
TUTORIAL5.description2=Lanuch balistic missiles and destroy enemy