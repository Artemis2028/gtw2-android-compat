plugins { id 'com.android.application' }

android {
    namespace 'com.invertbit.games.gtw.android'
    compileSdk 36
    // Stable signing: the same public debug key as the compat build (Uber APK Signer's
    // embedded debug.keystore, cert SHA-256 1e08a903...5953), so every source build installs
    // over the previous one. Fetch it with `python3 signing/fetch-debug-key.py`; CI does.
    // Without it, Gradle falls back to the machine's own ~/.android/debug.keystore.
    def stableKs = rootProject.file('signing/debug.keystore')
    signingConfigs {
        debug {
            if (stableKs.exists()) {
                storeFile stableKs
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    defaultConfig {
        applicationId 'com.invertbit.games.gtw.android.src'
        minSdk 21
        targetSdk 35
        versionCode 7
        versionName '1.5-src1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets.main.jniLibs.srcDirs = ["$buildDir/natives"]
    lint { abortOnError false; checkReleaseBuilds false }
    // Uncompressed natives so the APK can mmap them; AGP 8.5+ zip-aligns
    // uncompressed .so entries to 16 KB (zipalign -P 16). Combined with ELF
    // LOAD alignment this is what Android 15+ 16 KB page devices need.
    packaging { jniLibs { useLegacyPackaging false } }
}

configurations { natives }

dependencies {
    implementation project(':core')
    // 64-bit natives. libgdx.so must stay on 1.9.4: that is the last Maven build
    // whose JNI exports match the obfuscated 1.7.0 Java (AndroidGL20.*, Matrix4
    // overloads). 1.13.0+ / 1.14.2 are 16 KB-aligned but dropped those symbols,
    // so swapping libgdx.so would UnsatisfiedLinkError on the first GL call.
    // arm64 1.9.4 libgdx.so already has 64 KB LOAD alignment (16 KB-compatible).
    // x86_64 1.9.4 libgdx.so is still 4 KB — see README "What's left".
    natives 'com.badlogicgames.gdx:gdx-platform:1.9.4:natives-arm64-v8a'
    natives 'com.badlogicgames.gdx:gdx-platform:1.9.4:natives-x86_64'
    // FreeType JNI is compatible through 1.14.2 and those .so files are 16 KB-aligned.
    natives 'com.badlogicgames.gdx:gdx-freetype-platform:1.14.2:natives-arm64-v8a'
    natives 'com.badlogicgames.gdx:gdx-freetype-platform:1.14.2:natives-x86_64'
}

// 32-bit natives come straight from the original APK (libGDX 1.7.0, 4 KB pages;
// 16 KB devices are 64-bit and will not load these). 64-bit from Maven as above.
tasks.register('copyNatives') {
    def out = file("$buildDir/natives")
    def apk = rootProject.file('../original/GTW-II-1.5.apk')
    inputs.file apk
    outputs.dir out
    doLast {
        copy {
            from(zipTree(apk)) { include 'lib/armeabi/**', 'lib/armeabi-v7a/**', 'lib/x86/**' }
            into out
            eachFile { it.path = it.path - 'lib/' }
            includeEmptyDirs = false
        }
        configurations.natives.files.each { jar ->
            def abi = jar.name =~ /natives-([^.]+)\.jar$/
            if (abi) {
                copy { from(zipTree(jar)) { include '*.so' }; into "$out/${abi[0][1]}" }
            }
        }
    }
}
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('JniLibFolders') }.configureEach { dependsOn 'copyNatives' }
