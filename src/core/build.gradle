plugins { id 'java-library' }
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:-options', '-nowarn', '-Xmaxerrs', '5000', '-Xdiags:verbose']
}

// Drop the original GdxEglConfigChooser (a/Cg) so :android can ship the fallback chooser
// without a duplicate class. Everything else in the obfuscated libGDX jar is unchanged.
def filterGdxJar = tasks.register('filterGdxJar', Jar) {
    from(zipTree(file('../libs/gdx-1.7.0-invertbit.jar'))) {
        exclude 'com/badlogic/gdx/backends/android/a/Cg.class'
    }
    archiveFileName = 'gdx-1.7.0-invertbit-filtered.jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
}

dependencies {
    // Original (ProGuard-obfuscated) libGDX 1.7.0 bytecode from the APK, class names remapped
    // by decompile/import.sh. Exposed to :android as well, minus a.Cg (see filterGdxJar).
    api files(filterGdxJar)
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
