name: Build decompiled source

on:
  push:
    branches: [decompiled]
    paths: ['src/**', 'input/**', '.github/workflows/build-src.yml']
  pull_request:
    paths: ['src/**']
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: assembleDebug
        run: ./gradlew --no-daemon assembleDebug
      - name: Inspect APK
        run: |
          APK=android/build/outputs/apk/debug/android-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BT/aapt2" dump badging "$APK" | head -n 4
          "$BT/apksigner" verify --print-certs "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: GTW-II-src-debug-apk
          path: src/android/build/outputs/apk/debug/android-debug.apk
