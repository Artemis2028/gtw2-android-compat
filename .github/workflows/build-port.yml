name: Build libGDX 1.14 port

on:
  push:
    paths: ['port/**', 'src/android/src/main/assets/**', 'src/signing/**', '.github/workflows/build-port.yml']
  pull_request:
    paths: ['port/**', 'src/android/src/main/assets/**', '.github/workflows/build-port.yml']
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: port
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch the stable public debug key
        run: python3 ../src/signing/fetch-debug-key.py
      - name: assembleDebug
        run: ./gradlew --no-daemon :core:test assembleDebug
      - name: Inspect APK
        run: |
          APK=android/build/outputs/apk/debug/android-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BT/aapt2" dump badging "$APK" | head -n 6
          "$BT/apksigner" verify --print-certs "$APK"
          sha256sum "$APK"
      - name: Check signing certificate is the stable key
        run: |
          APK=android/build/outputs/apk/debug/android-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          EXPECTED=1e08a903aef9c3a721510b64ec764d01d3d094eb954161b62544ea8f187b5953
          GOT=$("$BT/apksigner" verify --print-certs "$APK" | grep -m1 -oE 'certificate SHA-256 digest: [0-9a-f]{64}' | awk '{print $NF}')
          echo "signing cert SHA-256: $GOT"
          test "$GOT" = "$EXPECTED"
      - name: Check applicationId
        run: |
          APK=android/build/outputs/apk/debug/android-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BT/aapt2" dump badging "$APK" | grep -q "name='com.invertbit.games.gtw.android.port'"
          "$BT/aapt2" dump badging "$APK" | grep -q "label='GTW II (Port)'"
      - uses: actions/upload-artifact@v4
        with:
          name: GTW-II-port-debug-apk
          path: port/android/build/outputs/apk/debug/android-debug.apk
