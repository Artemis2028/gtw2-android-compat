name: Build compat APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0'

      - name: Cache pinned tools and natives
        uses: actions/cache@v4
        with:
          path: |
            tools/*.jar
            native/*.jar
          key: tools-${{ hashFiles('toolchain.json') }}

      - name: Decode signing keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using KEYSTORE_BASE64 secret"
          else
            echo "::notice::No KEYSTORE_BASE64 secret; signing with the embedded public debug key"
          fi

      - name: Rebuild APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: python3 rebuild.py

      - name: Verify alignment and signature
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          APK=dist/GTW-II-1.5-compat.apk
          "$BT/zipalign" -c -v 4 "$APK" | tail -n 1
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" | head -n 3
          sha256sum "$APK" | tee dist/GTW-II-1.5-compat.apk.sha256
          echo "### APK sha256" >> "$GITHUB_STEP_SUMMARY"
          echo '`'"$(cut -d' ' -f1 dist/GTW-II-1.5-compat.apk.sha256)"'`' >> "$GITHUB_STEP_SUMMARY"
          if [ "$(cut -d' ' -f1 dist/GTW-II-1.5-compat.apk.sha256)" = "94bd59f74ef4602b4f6030246c1512519b803481c892945656315394c2f49b6f" ]; then
            echo "Byte-identical to compat1" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Not byte-identical to compat1 (expected: apktool/signing timestamps differ)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: GTW-II-1.5-compat-apk
          path: |
            dist/GTW-II-1.5-compat.apk
            dist/GTW-II-1.5-compat.apk.sha256

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GTW-II-1.5-compat.apk
            dist/GTW-II-1.5-compat.apk.sha256
